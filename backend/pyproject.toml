[project]
name = "chibi-live-shop-backend"
version = "0.1.0"
description = "Chibi AI TikTok Live Shop — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "rapidfuzz>=3.9",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdfium2>=4.30",  # BSD-3-Clause / Apache-2.0 — renders print PDFs for product faces
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
ai = ["anthropic>=0.40"]
tools = ["numpy>=1.26"]  # scripts/unwarp_box.py
# TikTokLive: unofficial, "Modified AGPL-3.0" (see docs/provider-limitations.md). Pinned to the
# version the adapter was tested against — upgrade deliberately and re-run the contract tests.
tiktok = ["TikTokLive==7.0.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
