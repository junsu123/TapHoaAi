name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Backend tests
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,tiktok]"
          .venv/bin/pytest -q
      - name: Frontend unit tests + build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build
      - name: Playwright smoke (real backend + WebGL on SwiftShader)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Windows game app (Electron) — unit tests + end to end under Xvfb
        if: always()
        working-directory: desktop
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          npm ci
          npm test
          xvfb-run -a -s "-screen 0 2000x2400x24" node test/app.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            frontend/test-results
            desktop/test-results
